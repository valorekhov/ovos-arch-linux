# OpenVoiceOS Audio Settings
# The Mark II / SJ201 whole card runs at 48 kHz (the XMOS mic is a 48 kHz I2S
# device and playback/capture share one clock). Pin the default and alternate
# rates to 48 kHz so Pulse never tries to switch the hardware rate, and never
# resample-avoid onto a rate the card cannot hold.
resample-method = ffmpeg
default-sample-format = s16le
default-sample-rate = 48000
alternate-sample-rate = 48000
default-sample-channels = 2
default-channel-map = front-left,front-right
avoid-resampling = no