# Installed by ovos-enclosure-audio-mpd
#
# Route MPD through the system-wide PulseAudio daemon so it mixes with the
# other players on the box (Squeezelite, Home Assistant) instead of opening
# the raw ALSA PCM exclusively -- the sj201 card allows only one direct ALSA
# client at a time, so a direct-ALSA MPD and PulseAudio cannot both play.
#
# MPD runs as user 'mpd', which is in the pulse-access group and reaches the
# system daemon (auth-anonymous) over /run/pulse/native.
audio_output {
    type    "pulse"
    name    "sj201"
    sink    "sj201"
}