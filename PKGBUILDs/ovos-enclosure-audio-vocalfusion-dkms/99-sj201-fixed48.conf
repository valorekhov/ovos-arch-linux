# Pin the SJ201 (Mycroft Mark II) I2S hardware to 48 kHz in both directions.
#
# The XMOS XVF3510 mic firmware runs its I2S at 48 kHz. The Pi is the I2S clock
# producer and playback (DEV=0) and capture (DEV=1) share that single clock, so
# both must run at the same rate. Exposing the raw hw device lets PulseAudio
# "reconfigure" the PCM to a stream's rate, which wedges the card
# ("Resume failed, couldn't restore original sample settings"). These plug PCMs
# hold the hardware at 48 kHz and resample in software, so the clock never
# changes even when a client asks for another rate.
pcm.sj201_play {
    type plug
    slave {
        pcm "hw:CARD=sj201,DEV=0"
        rate 48000
        channels 2
        format S16_LE
    }
}

pcm.sj201_mic {
    type plug
    slave {
        pcm "hw:CARD=sj201,DEV=1"
        rate 48000
        channels 2
        format S16_LE
    }
}